name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# Variant B: version is bumped in the PR. On merge we only tag + publish.
# Never push commits to main (merge queue / signed commits / PR-only).

jobs:
  release:
    name: Tag + crates.io + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve merged PR and plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/semver.sh .github/scripts/check-version-bump.sh
          # shellcheck source=/dev/null
          source .github/scripts/semver.sh

          TITLE="$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].title // empty' 2>/dev/null || true)"

          if [[ -z "$TITLE" ]]; then
            TITLE="$(git log -1 --pretty=%s)"
          fi

          echo "Resolved title: $TITLE"

          if [[ "$TITLE" =~ ^Merge\ pull\ request ]]; then
            echo "No conventional PR title; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="$(semver_parse_bump "$TITLE")"
          VERSION="$(semver_read_cargo_version Cargo.toml)"
          TAG="v${VERSION}"

          if [[ "$BUMP" == "invalid" || "$BUMP" == "none" ]]; then
            echo "Non-releasing title (${BUMP}); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The base is the Cargo.toml this merge replaced — the exact same one
          # the PR gate compared against, so a PR that passed cannot fail here.
          #
          # It used to be the previous git tag. That reads an *output* of this
          # job as its own input: the first merge that failed for any reason
          # created no tag, so every later merge measured from a base further
          # and further behind, and none of them could ever pass again. Tags are
          # written by this job and never read by it.
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] \
            || ! git cat-file -e "${BEFORE}:Cargo.toml" 2>/dev/null; then
            echo "::error::Cannot read the pre-merge Cargo.toml (before=${BEFORE:-unset}); refusing to publish."
            exit 1
          fi

          # One implementation of the rule, shared with the PR gate, so the two
          # can never drift apart again.
          if ! .github/scripts/check-version-bump.sh "$TITLE" "$BEFORE"; then
            echo "::error::Version bump check failed against the pre-merge tree."
            exit 1
          fi

          {
            echo "skip=false"
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "bump=${BUMP}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Will release ${TAG} (${BUMP}) for: ${TITLE}"

      - name: Create tag
        if: steps.plan.outputs.skip != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; aborting to avoid overwrite."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

      - name: Publish to crates.io
        if: steps.plan.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set."
            exit 1
          fi
          cargo publish --locked

      - name: Create GitHub Release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            include/arcane_sdk.h \
            --title "$TAG" \
            --notes "$(cat <<EOF
          ## ${TAG}

          - **Bump:** ${BUMP}
          - **PR:** ${TITLE}

          ### Install

          \`\`\`toml
          [dependencies]
          arcane-sdk = "${VERSION}"
          \`\`\`

          C/C++ header: \`include/arcane_sdk.h\` (attached to this release).
          EOF
          )"
