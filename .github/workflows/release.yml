name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: SemVer tag on main
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Optional PAT/App token that can push to protected main.
          # Fallback: GITHUB_TOKEN (needs "Allow GitHub Actions to bypass" or no push restriction).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve merged PR title
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TITLE="$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].title // empty' 2>/dev/null || true)"

          if [[ -z "$TITLE" ]]; then
            TITLE="$(git log -1 --pretty=%s)"
          fi

          if [[ "$TITLE" =~ ^Merge\ pull\ request ]]; then
            echo "No conventional PR title associated with this push; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved title: $TITLE"

      - name: Bump version
        id: bump
        if: steps.pr.outputs.skip != 'true'
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/bump-version.sh
          eval "$(.github/scripts/bump-version.sh "$PR_TITLE")"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bump=$BUMP version=$VERSION"

      - name: Commit, tag, and push
        if: steps.pr.outputs.skip != 'true' && steps.bump.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; aborting to avoid overwrite."
            exit 1
          fi

          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): ${TAG}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Verify C header
        if: steps.pr.outputs.skip != 'true' && steps.bump.outputs.bump != 'none'
        run: |
          set -euo pipefail
          cargo install cbindgen --locked
          chmod +x .github/scripts/generate-header.sh
          .github/scripts/generate-header.sh
          git diff --exit-code -- include/arcane_sdk.h

      - name: Publish to crates.io
        if: steps.pr.outputs.skip != 'true' && steps.bump.outputs.bump != 'none'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set; skipping crates.io publish."
            exit 1
          fi
          cargo publish --locked

      - name: Create GitHub Release
        if: steps.pr.outputs.skip != 'true' && steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TITLE: ${{ steps.pr.outputs.title }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release create "$TAG" \
            include/arcane_sdk.h \
            --title "$TAG" \
            --notes "$(cat <<EOF
          ## ${TAG}

          - **Bump:** ${BUMP}
          - **PR:** ${TITLE}

          ### Install

          \`\`\`toml
          [dependencies]
          arcane-sdk = "${VERSION}"
          \`\`\`

          C/C++ header: \`include/arcane_sdk.h\` (attached to this release).
          EOF
          )"
