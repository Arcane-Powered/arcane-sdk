name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # crates.io versions are immutable; keep in sync with generate-header.sh
  CBINDGEN_VERSION: "0.29.4"

jobs:
  check:
    name: Check + C header
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked

      - name: Verify C header (pinned cbindgen)
        run: |
          set -euo pipefail
          cargo install cbindgen --version "$CBINDGEN_VERSION" --locked --force
          chmod +x .github/scripts/generate-header.sh
          .github/scripts/generate-header.sh
          git diff --exit-code -- include/arcane_sdk.h

  unity:
    name: Unity binding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install a C# compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-mcs

      - name: Compile the runtime sources
        # The engine-facing files (ArcaneRuntime, ArcaneSettings, the Editor
        # scripts, the samples) need UnityEngine to compile and are covered by
        # the package's own EditMode tests instead. Everything under Runtime
        # that is not behind UNITY_5_3_OR_NEWER compiles standalone, which is
        # where the marshalling, the JSON reader and the models live.
        run: |
          set -euo pipefail
          mcs -target:library -langversion:latest -warnaserror -out:/tmp/ArcanePowered.dll \
            bindings/unity/com.arcane-powered.sdk/Runtime/*.cs \
            bindings/unity/com.arcane-powered.sdk/Runtime/Native/*.cs \
            bindings/unity/com.arcane-powered.sdk/Runtime/Json/*.cs

      - name: Check the plugin build script
        run: bash -n bindings/unity/build-plugins.sh
