name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # crates.io versions are immutable; keep in sync with generate-header.sh
  CBINDGEN_VERSION: "0.29.4"

jobs:
  check:
    name: Check + C header
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check --locked

      - name: Verify C header (pinned cbindgen)
        run: |
          set -euo pipefail
          cargo install cbindgen --version "$CBINDGEN_VERSION" --locked --force
          chmod +x .github/scripts/generate-header.sh
          .github/scripts/generate-header.sh
          git diff --exit-code -- include/arcane_sdk.h
