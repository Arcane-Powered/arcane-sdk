[package]
name = "arcane-sdk"
version = "0.8.0"
edition = "2021"
description = "Arcane Powered game SDK core (ownership tickets, DRM checks)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Arcane-Powered/arcane-sdk"
homepage = "https://github.com/Arcane-Powered/arcane-sdk"
documentation = "https://docs.rs/arcane-sdk"
keywords = ["game", "sdk", "drm", "ownership", "ffi"]
categories = ["game-development", "api-bindings"]
exclude = ["documentation/", ".github/"]

[lib]
name = "arcane_sdk"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
open = "5"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
