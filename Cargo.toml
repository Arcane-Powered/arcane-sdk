[package]
name = "arcane-sdk"
version = "0.1.0"
edition = "2021"
description = "Arcane Powered game SDK core (ownership tickets, DRM checks)"
license = "UNLICENSED"

[lib]
name = "arcane_sdk"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
thiserror = "2"
