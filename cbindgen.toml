# cbindgen configuration for the C ABI header.
# Regenerate: .github/scripts/generate-header.sh

language = "C"
header = "/* SPDX-License-Identifier: MIT OR Apache-2.0 */"
autogen_warning = "/* Generated by cbindgen from src/ffi.rs — do not edit by hand. */"
include_guard = "ARCANE_SDK_H"
pragma_once = true
usize_is_size_t = true
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"

[export]
include = [
  "ARCANE_OK",
  "ARCANE_ERR_ARGUMENT",
  "ARCANE_ERR_SDK",
  "ARCANE_ERR_NOT_INITIALIZED",
  "ARCANE_ERR_BAD_BUFFER",
  "ARCANE_ERR_BUFFER_TOO_SMALL",
  "ARCANE_ERR_UNAVAILABLE",
  "ARCANE_OWNERSHIP_OWNED",
  "ARCANE_OWNERSHIP_DRM_DISABLED",
  "arcane_sdk_init",
  "arcane_sdk_refresh",
  "arcane_sdk_shutdown",
  "arcane_sdk_frame",
  "arcane_sdk_set_graphics",
  "arcane_sdk_session_json",
  "arcane_sdk_achievements_json",
  "arcane_sdk_achievement_unlock",
  "arcane_sdk_achievement_is_unlocked",
  "arcane_sdk_is_initialized",
  "arcane_sdk_ownership",
  "arcane_sdk_ticket_expires_at",
  "arcane_sdk_checked_at",
  "arcane_sdk_user_id",
  "arcane_sdk_game_id",
  "arcane_sdk_public_key",
  "arcane_sdk_device_hash",
  "arcane_sdk_last_error_json",
]
item_types = ["constants", "functions"]
# Rust-only; an unprefixed macro of this name would collide in a C project.
exclude = ["MAX_PUBLIC_KEY_LEN", "MAX_ACHIEVEMENT_KEY_LEN"]

[fn]
prefix = ""
sort_by = "Name"
